# The example sites that are packages of their own (the others under
# examples/sites/ are served by vite.panels.config.ts).
packages:
  - "examples/sites/*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
