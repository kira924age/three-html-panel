<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="three-html-panel live demo: real web sites, built with different frameworks, running as interactive panels in a three.js scene."
    />
    <title>three-html-panel live demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1d2129;
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      #hud {
        position: fixed;
        left: 16px;
        bottom: 16px;
        max-width: calc(100% - 32px);
        color: #c9d1dc;
        font-size: 13px;
        line-height: 1.6;
        pointer-events: none;
      }
      #hud strong {
        color: #fff;
      }
      #hud a {
        color: #8ab4ff;
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <strong>three-html-panel</strong> — web sites from other origins, running in iframes and drawn
      as textures in a three.js scene. Choose one on the panel to the left.<br />
      Drag outside the panels to look around · wheel or drag a finger over a panel to scroll it · in
      VR, point and pull the trigger ·
      <a href="https://github.com/urth-inc/three-html-panel" target="_blank" rel="noopener"
        >GitHub</a
      >
      ·
      <a href="https://www.npmjs.com/package/@urth/three-html-panel" target="_blank" rel="noopener"
        >npm</a
      >
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
